<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<title>AIOS</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
/* Lokal eingebettete Schriften statt Google-Fonts-@import: das Dashboard läuft
   ausschließlich lokal, ein externer @import würde bei jedem Seitenaufruf
   Adresse und User-Agent an einen fremden Font-Server melden und offline
   andere Schriften zeigen als online. Nur die tatsächlich genutzten Schnitte
   (latin), Inter als Variable-Font-Datei deckt 400-700 in einer Datei ab.
   Fallback auf Systemschriften (--serif/--sans unten) bleibt unverändert. */
@font-face{font-family:"Instrument Serif";font-style:normal;font-weight:400;font-display:swap;src:url("fonts/instrument-serif-normal-400.woff2") format("woff2");}
@font-face{font-family:"Instrument Serif";font-style:italic;font-weight:400;font-display:swap;src:url("fonts/instrument-serif-italic-400.woff2") format("woff2");}
@font-face{font-family:"Inter";font-style:normal;font-weight:400 700;font-display:swap;src:url("fonts/inter-normal-400-700.woff2") format("woff2");}
:root{
  --bg:#f4f1ea; --ink:#0f0f0f; --ink-2:#1a1a1a;
  --text:#0f0f0f; --text-2:rgba(26,26,26,0.72); --muted:rgba(26,26,26,0.55); --faint:rgba(26,26,26,0.4);
  --accent:#ff4500; --accent-soft:rgba(255,69,0,0.10);
  --card:rgba(255,255,255,0.42); --card-solid:#faf8f3; --border:rgba(15,15,15,0.08); --border-2:rgba(15,15,15,0.14); --divider:rgba(15,15,15,0.12);
  --ok:oklch(0.6 0.045 150); --ok-bg:oklch(0.6 0.045 150 / 0.12);
  --warn:oklch(0.7 0.1 72); --warn-bg:oklch(0.7 0.1 72 / 0.14);
  --fail:oklch(0.55 0.15 28); --fail-bg:oklch(0.55 0.15 28 / 0.12);
  --radius:18px; --radius-sm:12px; --sbw:68px; --sbw-open:248px;
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15.5px;line-height:1.5;overflow-x:hidden;-webkit-font-smoothing:antialiased}
.ornament{position:fixed;top:-280px;right:-240px;width:740px;height:740px;border-radius:50%;background:radial-gradient(circle,#ff5a00 0%,#ff2d6f 58%,transparent 74%);opacity:0.12;filter:blur(12px);pointer-events:none;z-index:0}
a{color:var(--accent);text-decoration:none}
a:hover{color:#d93a00}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sb-item:focus-visible,.tg-head:focus-visible{outline-offset:-2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-weight:600;font-size:13px;letter-spacing:0.28em;text-transform:uppercase;color:var(--accent);margin:0}
h1.title{font-family:var(--serif);font-weight:400;font-size:38px;letter-spacing:-0.02em;line-height:1;margin:4px 0 0}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0}
.dot.ok,.dot.active{background:var(--ok)} .dot.warn,.dot.aging{background:var(--warn)} .dot.fail{background:var(--fail)}
.dot.dormant{background:transparent;box-shadow:inset 0 0 0 1.5px var(--muted)}
.sym{font-weight:700;font-size:12px;line-height:1}
.sym.ok{color:var(--ok)} .sym.warn{color:var(--warn)} .sym.fail{color:var(--fail)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:22px 26px;backdrop-filter:blur(3px)}
#vertriebWrap>.card+.card{margin-top:18px}
.goto{font-size:12px;font-weight:600;margin-left:auto}
.kpi-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-top:24px;margin-bottom:24px}
.ktile{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;display:block;color:inherit;transition:border-color .15s,transform .15s}
a.ktile:hover{border-color:var(--border-2);transform:translateY(-1px);color:inherit}
.ktile .n{font-family:var(--serif);font-size:36px;line-height:.95;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.ktile.alert .n{color:var(--accent)}
.ktile .l{font-size:12.5px;font-weight:600;margin-top:7px}
.ktile .s{font-size:11.5px;color:var(--muted);margin-top:1px}

/* ===== Sidebar ===== */
#sb{position:fixed;left:0;top:0;bottom:0;width:var(--sbw);background:var(--card-solid);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:100;transition:width .18s ease;overflow:hidden}
body.sb-open #sb{width:var(--sbw-open)}
.sb-top{display:flex;align-items:center;gap:12px;padding:18px 16px 14px;flex-shrink:0}
#sbToggle{border:none;background:transparent;cursor:pointer;width:36px;height:36px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink);flex-shrink:0}
#sbToggle:hover{background:rgba(15,15,15,0.06)}
.sb-brand{font-family:var(--serif);font-size:21px;letter-spacing:-.01em;white-space:nowrap;opacity:0;transition:opacity .15s}
.sb-brand em{font-style:italic;color:var(--accent)}
body.sb-open .sb-brand{opacity:1}
.sb-nav{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 0 8px;scrollbar-width:none}
.sb-nav::-webkit-scrollbar{display:none}
.sb-group{margin-top:14px}
.sb-group-label{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:0 20px 6px;white-space:nowrap;opacity:0;transition:opacity .15s;height:16px}
body.sb-open .sb-group-label{opacity:1}
.sb-item{display:flex;align-items:center;gap:13px;width:calc(100% - 20px);margin:2px 10px;padding:10px 9px;border:none;background:transparent;border-radius:11px;cursor:pointer;color:var(--text-2);font-family:inherit;font-size:14px;font-weight:500;white-space:nowrap;position:relative}
.sb-item:hover{background:rgba(15,15,15,0.05);color:var(--ink)}
.sb-item.on{background:var(--accent-soft);color:var(--ink)}
.sb-item.on .sb-ico{color:var(--accent)}
.sb-ico{width:30px;height:22px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--muted)}
.sb-ico svg{width:19px;height:19px}
.sb-label{opacity:0;transition:opacity .15s}
body.sb-open .sb-label{opacity:1}
.nav-badge{margin-left:auto;background:var(--accent);color:#fff;font-size:10.5px;font-weight:700;min-width:18px;height:18px;border-radius:999px;display:none;align-items:center;justify-content:center;padding:0 5px;opacity:0;transition:opacity .15s}
body.sb-open .nav-badge{opacity:1}
.sb-foot{flex-shrink:0;border-top:1px solid var(--divider);padding:12px 10px;position:relative}
#profileBtn{display:flex;align-items:center;gap:12px;width:100%;padding:8px 9px;border:none;background:transparent;border-radius:11px;cursor:pointer;font-family:inherit;text-align:left;white-space:nowrap}
#profileBtn:hover{background:rgba(15,15,15,0.05)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--bg);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.pf-meta{opacity:0;transition:opacity .15s;min-width:0}
.pf-name,.pf-sub{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body.sb-open .pf-meta{opacity:1}
.pf-name{font-size:13.5px;font-weight:600;color:var(--ink)}
.pf-sub{font-size:11px;color:var(--muted)}
.sb-foot .menu{bottom:calc(100% + 6px);top:auto;left:10px;right:10px}
body:not(.sb-open) .sb-foot .menu{position:fixed;left:calc(var(--sbw) + 8px);right:auto;top:auto;bottom:14px;width:236px}

/* ===== Content ===== */
.content{position:relative;z-index:1;margin-left:var(--sbw);transition:margin-left .18s ease;padding:34px 40px 120px;max-width:1320px}
body.sb-open .content{margin-left:var(--sbw-open)}
header.head{display:flex;justify-content:space-between;align-items:flex-start;gap:28px;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--divider);margin-bottom:8px}
.page-sub{font-size:14px;color:var(--muted);margin-top:8px}
.stand{font-size:12px;color:var(--faint);margin-left:10px}
.stand .demo-flag{margin-right:6px}
.head-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;text-align:right}
.head-clock-row{display:flex;align-items:center;justify-content:flex-end;gap:14px}
.head-clock{font-family:var(--serif);font-size:44px;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.head-date{font-size:13.5px;color:var(--muted);letter-spacing:-0.005em;line-height:1.2}
.head-date em{font-style:italic;color:var(--accent)}
.head-sub{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:10px}
.head-actions{display:flex;align-items:center;gap:10px;margin-top:2px}
.badge{display:inline-flex;align-items:center;gap:7px;padding:6px 14px;border-radius:999px;font-size:12px;font-weight:600;border:1.5px solid var(--border-2);background:rgba(255,255,255,0.35)}
.badge.ok{border-color:var(--ok);color:var(--ok);background:var(--ok-bg)}
.badge.warn{border-color:var(--warn);color:var(--warn);background:var(--warn-bg)}
.badge.fail{border-color:var(--fail);color:var(--fail);background:var(--fail-bg)}
.pill{font-family:inherit;font-size:13px;font-weight:600;padding:8px 18px;border-radius:999px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;transition:background .15s}
.pill:hover{background:rgba(15,15,15,0.06)}
.pill:disabled{opacity:.4;cursor:not-allowed}
.icon-btn{border:1.5px solid var(--border-2);background:rgba(255,255,255,0.35);color:var(--ink-2);cursor:pointer;width:34px;height:34px;border-radius:999px;font-size:18px;line-height:1;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.icon-btn:hover{background:rgba(15,15,15,0.06)}
.icon-btn:disabled{opacity:.5;cursor:wait}
.icon-btn.spinning svg{animation:spin 1s linear infinite}
.menu-wrap{position:relative}
.page{display:none}
.page.on{display:block}
section.blk{margin-top:40px}
.sec-head{display:flex;align-items:baseline;gap:14px;margin:0 0 18px}
.sec-head h2{font-family:var(--serif);font-weight:400;font-size:27px;letter-spacing:-0.01em;margin:0}
.sec-head h2 em{font-style:italic;color:var(--accent)}
.sec-head .kick{font-size:11.5px;letter-spacing:0.22em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sec-head .rule{flex:1;height:1px;background:var(--divider);align-self:center}
.sec-head .aside{font-size:12.5px;color:var(--muted)}

/* ===== Dashboard ===== */
.brain-wrap{display:grid;grid-template-columns:1fr 300px;gap:18px;align-items:stretch}
.hero{position:relative;height:440px;border-radius:24px;overflow:hidden;background:linear-gradient(160deg,rgba(255,255,255,0.5),rgba(255,255,255,0.22));border:1px solid var(--border)}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
.hero canvas:active{cursor:grabbing}
.hero-overlay{position:absolute;inset:0;pointer-events:none;padding:22px 26px;display:flex;flex-direction:column;justify-content:space-between}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start}
.hero-eye{font-size:11.5px;letter-spacing:0.24em;text-transform:uppercase;color:var(--muted);font-weight:600}
.hero-chip{pointer-events:auto;background:var(--card-solid);border:1px solid var(--border);border-radius:999px;padding:7px 15px;font-size:12.5px;color:var(--text-2);box-shadow:0 2px 10px rgba(0,0,0,.05);min-height:32px;display:flex;align-items:center;gap:8px;max-width:340px;opacity:0;transition:opacity .18s}
.hero-chip.show{opacity:1}
.hero-chip .cdot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.hero-bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:20px}
.hero-total .n{font-family:var(--serif);font-size:64px;line-height:.85;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.hero-total .n small{color:var(--accent);font-size:.4em;font-style:italic;vertical-align:super;margin-left:6px}
.hero-total .l{font-size:13px;color:var(--muted);margin-top:8px}
.hero-hint{font-size:11.5px;color:var(--faint);text-align:right;line-height:1.5}
.hero-state{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px}
.kpi-rail{background:var(--card-solid);border:1px solid var(--border);border-radius:24px;padding:20px 24px;display:flex;flex-direction:column}
.kpi-rail .rail-title{font-size:11px;letter-spacing:0.22em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:4px}
.kpi{flex:1;display:flex;align-items:center;justify-content:space-between;gap:14px;border-top:1px solid var(--divider);padding:12px 0}
.kpi:first-of-type{border-top:none}
.kpi .n{font-family:var(--serif);font-size:36px;line-height:.9;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .meta{text-align:right}
.kpi .l{font-size:13.5px;font-weight:600}
.kpi .s{font-size:11.5px;color:var(--muted);margin-top:2px}
.today{display:grid;grid-template-columns:1.55fr 1fr;gap:18px;align-items:start}
.focus{padding:6px 22px}
.focus-item{display:grid;grid-template-columns:34px 1fr;gap:16px;padding:20px 0;border-top:1px solid var(--divider);align-items:start}
.focus-item:first-child{border-top:none;padding-top:16px}
.focus-item:last-child{padding-bottom:16px}
.focus-item .num{font-family:var(--serif);font-size:30px;line-height:1.1;color:var(--faint);font-style:italic;text-align:right;padding-top:14px}
.focus-item.tone-fail .num,.focus-item.tone-warn .num{color:var(--accent)}
.focus-item .kick{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:7px}
.focus-item .lead{font-family:var(--serif);font-size:23px;line-height:1.2;letter-spacing:-.01em}
.focus-item .sub{font-size:13px;color:var(--text-2);margin-top:7px}
.side-stack{display:flex;flex-direction:column;gap:16px}
.side-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 20px}
.side-card h4{margin:0 0 10px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:700;display:flex;align-items:baseline}
.appt{display:flex;gap:12px;padding:7px 0;border-bottom:1px solid var(--divider);font-size:14px}
.appt:last-child{border-bottom:none}
.appt .t{font-family:var(--mono);font-weight:600;color:var(--accent);font-size:13px;min-width:46px}
.appt .src{margin-left:auto;font-size:11px;color:var(--faint);white-space:nowrap}
.mailrow{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:13.5px;border-bottom:1px solid var(--divider)}
.mailrow:last-child{border-bottom:none}
.mailrow .c{font-family:var(--mono);font-weight:600;font-size:14px;min-width:20px;text-align:center}
.mailrow.handeln .c{color:var(--fail)} .mailrow.warten .c{color:var(--warn)} .mailrow.kenntnis .c{color:var(--muted)}
.mini-proj{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--divider);color:inherit}
.mini-proj:last-child{border-bottom:none}
.mini-proj:hover .mp-name{color:var(--accent)}
.mp-body{flex:1;min-width:0}
.mp-name{display:block;font-size:13.5px;font-weight:600;color:var(--ink)}
.mp-sub{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mp-sub.fmtwarn{color:var(--warn);font-weight:600}
.mp-count{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--accent)}
.mp-count-wrap{display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.mp-count-lbl{font-size:9px;letter-spacing:.04em;color:var(--muted);text-transform:uppercase}
.sysline{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 22px;margin-top:18px;font-size:14.5px}
.sysline-txt{font-weight:600}
.sysline-sub{font-size:12.5px;color:var(--muted)}
.quiet{font-size:13px;color:var(--muted);font-style:italic;padding:4px 0}

/* ===== Projekte ===== */
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px;align-items:stretch}
.proj{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px 14px;backdrop-filter:blur(3px);color:inherit;transition:border-color .15s,transform .15s}
.proj:hover{border-color:var(--border-2);transform:translateY(-1px);color:inherit}
.proj-head{display:flex;align-items:center;gap:10px}
.proj-head h3{margin:0;font-size:16px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.proj-head h3 .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj-head .when,.pd-head .when{font-size:12px;color:var(--muted);white-space:nowrap}
.proj-next{font-size:13.5px;line-height:1.45;color:var(--text-2);margin-top:12px;flex:1}
.proj-next .nx{display:block;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:4px}
.proj-note{font-size:13px;color:var(--muted);padding:12px 0 4px;line-height:1.5;flex:1}
.proj-note.ok{color:var(--ok);font-weight:500}
.proj-foot{display:flex;align-items:center;gap:12px;margin-top:14px;padding-top:11px;border-top:1px solid var(--divider)}
.opencount{font-size:12px;color:var(--muted)}
.openlink{font-size:12.5px;font-weight:600;color:var(--accent);margin-left:auto}
.rest-list{margin-top:28px}
.rest-title{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 6px}
.rest-row{display:flex;align-items:center;gap:14px;padding:12px 4px;border-top:1px solid var(--divider);font-size:14px;color:inherit}
.rest-row:hover .nm{color:var(--accent)}
.rest-row .nm{font-weight:600;min-width:160px}
.rest-row .when{color:var(--muted);font-size:12.5px;flex:1}
.chip{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;padding:3px 10px;border-radius:999px;border:1px solid var(--border-2);color:var(--muted)}
.chip.old{border-color:var(--warn);color:var(--warn)}
.back{font-size:13px;font-weight:600}
.pd-head{display:flex;align-items:center;gap:14px;margin:14px 0 18px}
.pd-head h2{font-family:var(--serif);font-weight:400;font-size:34px;letter-spacing:-.01em;margin:0;display:flex;align-items:center;gap:12px}
.pd-sub{font-size:13px;color:var(--muted);display:flex;align-items:center;margin-bottom:6px}
.todos{list-style:none;padding:0;margin:6px 0 0}
.todos li{display:flex;align-items:flex-start;gap:11px;padding:10px 0;font-size:14px;line-height:1.45;border-bottom:1px solid var(--divider)}
.todos li:last-child{border-bottom:none}
.todos li.removing{opacity:.35}
.chk{appearance:none;-webkit-appearance:none;width:17px;height:17px;border:1.5px solid var(--border-2);border-radius:5px;margin:2px 0 0;cursor:pointer;flex-shrink:0;position:relative;background:rgba(255,255,255,.5)}
.chk:checked{background:var(--ok);border-color:var(--ok)}
.chk:checked::after{content:"✓";position:absolute;inset:0;color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center}
.chk:disabled{opacity:.5;cursor:wait}
.todos .txt{flex:1}
.todos .dl{display:inline-block;margin-left:10px;font-size:11px;font-weight:600;color:var(--accent)}
.todos li.done .txt{text-decoration:line-through;opacity:.5}
.rm{border:none;background:transparent;color:var(--faint);cursor:pointer;font-size:13px;line-height:1;padding:2px 4px;flex-shrink:0;opacity:0;transition:opacity .15s}
.todos li:hover .rm{opacity:1}
.rm:hover{color:var(--fail)}
.confirm{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--fail);margin-top:6px}
.confirm button{font-size:11px;padding:3px 10px;border-radius:999px;border:1px solid currentColor;background:transparent;cursor:pointer;color:inherit}
.confirm button.no{color:var(--muted)}
.undo{font-size:12px;color:var(--accent);cursor:pointer}
.undo:hover{text-decoration:underline}
.tg{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:14px;backdrop-filter:blur(3px)}
.tg-head{display:flex;align-items:center;gap:11px;padding:16px 22px;cursor:pointer;user-select:none}
.tg-head .nm{font-size:15.5px;font-weight:600;flex:1;display:flex;align-items:center;gap:10px}
.tg-head .cnt{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:10px}
.tg-head .arr{font-size:12px;color:var(--muted);transition:transform .15s}
.tg.open .tg-head .arr{transform:rotate(90deg)}
.tg-body{display:none;padding:0 22px 14px;border-top:1px solid var(--divider)}
.tg.open .tg-body{display:block}
.tg-cluster{display:flex;align-items:baseline;gap:10px;margin:16px 0 0;padding-top:8px}
.tg-cluster:first-child{margin-top:6px}
.tg-cluster-nm{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--accent)}
.tg-cluster-cnt{font-size:11.5px;color:var(--muted)}
.tg-clusters-flag{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:2px 9px}
.tg-foot{display:flex;gap:14px;padding-top:10px;margin-top:4px;border-top:1px solid var(--divider);font-size:12.5px}
.due-sec{margin-bottom:26px}
.due-sec .todos li{font-size:14px}
.due-proj{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-left:10px}

/* ===== Projekt-Status (Aktiv/Ruhend) · Drag&Drop · Verstreut-Hinweis ===== */
.pd-actions{margin-left:auto;display:flex;align-items:center;gap:12px}
.foot-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.foot-right .openlink{margin-left:0}
.statustog{font-family:inherit;font-size:11.5px;font-weight:600;padding:4px 11px;border-radius:999px;border:1.5px solid var(--border-2);background:transparent;color:var(--text-2);cursor:pointer;white-space:nowrap}
.statustog:hover{background:rgba(15,15,15,0.06);color:var(--ink);border-color:var(--ink)}
.rest-row .statustog{margin-left:4px}
.manual-tag{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted);border:1px solid var(--border-2);border-radius:999px;padding:1px 7px;margin-left:8px}
.tg .draghandle{cursor:grab;color:var(--faint);font-size:14px;line-height:1;padding:2px;user-select:none;flex-shrink:0}
.tg .draghandle:hover{color:var(--ink)}
.tg .draghandle:active{cursor:grabbing}
.tg.dragging{opacity:.55;border-color:var(--accent);box-shadow:0 8px 24px rgba(0,0,0,.12)}
.tg-scatter-flag{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--warn);background:var(--warn-bg);border-radius:999px;padding:2px 9px}
.dnd-hint{margin-left:12px;font-size:10.5px;letter-spacing:0;text-transform:none;font-weight:500;color:var(--faint)}
.scatter-note{margin-bottom:20px}
.scatter-h{display:flex;align-items:center;gap:9px;font-size:14.5px}
.scatter-h b{font-weight:600}
.scatter-p{font-size:13px;color:var(--text-2);line-height:1.55;margin:8px 0 12px;max-width:660px}
.scatter-list{display:flex;flex-direction:column;gap:8px}
.scatter-row{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--divider)}
.scatter-row .nm{font-weight:600;font-size:13.5px}
.scatter-row .cnt{font-size:11.5px;color:var(--warn);font-weight:600}
.scatter-row .mini{margin-left:auto}

/* ===== Inbox ===== */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.chip-btn{font-family:inherit;font-size:13px;font-weight:600;padding:7px 15px;border-radius:999px;border:1.5px solid var(--border-2);background:transparent;color:var(--text-2);cursor:pointer}
.chip-btn .mono{color:var(--muted);font-size:12px;margin-left:2px}
.chip-btn:hover{background:rgba(15,15,15,0.05)}
.chip-btn.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.chip-btn.on .mono{color:rgba(244,241,234,.7)}
.ib-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:12px}
.ib-stand{font-weight:600;color:var(--text-2)}
.ib-acc{font-weight:500}
.ib-acc.err{color:var(--fail);font-weight:600}
.ib-dot{color:var(--faint)}
.ib-hint{font-size:12.5px;color:var(--fail);background:var(--fail-bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 13px;margin-bottom:16px;line-height:1.5}
.ib-hint b{font-weight:600}
.ib-note{font-size:12px;color:var(--muted);margin-bottom:18px;line-height:1.5}
.ib-note b{font-weight:600;color:var(--text-2)}
.side-note{font-size:11.5px;color:var(--faint);margin-top:8px;padding-top:8px;border-top:1px solid var(--divider);line-height:1.45}
.ib-group{margin-bottom:26px}
.ib-title{display:flex;align-items:center;gap:9px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:10px}
.ib-row{display:flex;gap:16px;margin-bottom:10px;padding:16px 20px}
.ib-main{flex:1;min-width:0}
.ib-head{display:flex;gap:10px;align-items:baseline;font-size:12px;color:var(--muted)}
.ib-src{font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;border:1px solid var(--border-2);border-radius:999px;padding:2px 9px}
.ib-from{font-weight:600;color:var(--text-2)}
.ib-age{margin-left:auto;font-size:11.5px}
.ib-subj{font-size:15.5px;font-weight:600;margin-top:7px}
.ib-sum{font-size:13.5px;color:var(--text-2);margin-top:3px;line-height:1.5}

/* ===== Skills / Commands / Automationen ===== */
.grp-title{font-family:var(--serif);font-size:22px;margin:26px 0 14px;display:flex;align-items:baseline;gap:12px}
.grp-title:first-child{margin-top:0}
.skill-filter{align-items:center;gap:10px}
.skill-filter .chips{margin-bottom:0}
.pd-actions .chips{margin-bottom:0}
.filter-search{min-width:220px}
.filter-search:focus{outline:none;border-color:var(--ink)}
.grp-count{font-size:15px;color:var(--faint);font-weight:400}
.tile-head .cmd{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:54%}
.tile-tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;letter-spacing:.01em;padding:3px 9px 3px 7px;border-radius:999px;white-space:nowrap;margin-right:auto}
.tile-tag .dot{width:6px;height:6px}
.tile-tag.is-on{color:var(--ok);background:var(--ok-bg)}
.tile-tag.is-off{color:var(--faint);background:rgba(15,15,15,0.04)}
.tile-off{opacity:.62}
.tile-off .cmd{color:var(--muted)}
.grp-sub{font-family:var(--sans);font-size:12.5px;color:var(--muted)}
.tile-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.tile{padding:18px 20px;display:flex;flex-direction:column}
.tile-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.cmd{font-size:12.5px;font-weight:600;color:var(--ink-2);background:rgba(15,15,15,0.06);border-radius:8px;padding:4px 10px;font-family:var(--mono)}
.tile-title{font-size:16px;font-weight:600;letter-spacing:-.01em}
.tile-desc{font-size:13px;color:var(--text-2);line-height:1.55;margin-top:5px;flex:1}
.tile-bar{display:flex;align-items:center;gap:10px;margin-top:14px}
.bar-track{flex:1;height:7px;background:rgba(15,15,15,0.07);border-radius:999px;overflow:hidden}
.bar-fill{display:block;height:100%;background:var(--accent);border-radius:999px}
.bar-fill.dim{background:rgba(15,15,15,0.26)}
.bar-n{font-size:11px;color:var(--muted)}
.hint-line{font-size:13px;color:var(--muted);margin-top:22px;padding-top:16px;border-top:1px solid var(--divider)}
.hint-line b{color:var(--accent);font-weight:600}
.cmd-row{display:flex;align-items:center;gap:18px;padding:13px 0;border-bottom:1px solid var(--divider)}
.cmd-row:last-child{border-bottom:none}
.cmd-row .cmd{min-width:150px;text-align:center}
.cmd-was{flex:1;font-size:14px}
.cmd-wann{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.auto-when{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.auto-last{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:12px;padding-top:10px;border-top:1px solid var(--divider)}
.runhist{display:flex;gap:5px;margin-top:8px}
.auto-err{font-size:12px;color:var(--fail);margin-top:6px}

/* ===== Nutzung ===== */
.stat-row{display:flex;gap:48px;flex-wrap:wrap}
.stat .n{font-family:var(--serif);font-size:42px;line-height:.9;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .l{font-size:12.5px;color:var(--muted);margin-top:8px}
.bars-title{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:22px 0 12px}
.card>.bars-title:first-child{margin-top:0}
.day-chart{display:flex;gap:12px;align-items:flex-end;padding-top:6px}
.day-col{flex:1;min-width:0;display:flex;flex-direction:column}
.day-plot{position:relative;height:172px;width:100%}
.day-bar{position:absolute;left:0;right:0;bottom:0;margin:0 auto;width:100%;max-width:46px;background:rgba(15,15,15,0.42);border-radius:7px 7px 3px 3px;min-height:4px}
.day-col.dc-today .day-bar{background:var(--accent);opacity:.9}
.day-n{position:absolute;left:0;right:0;text-align:center;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.day-foot{margin-top:9px;height:32px;overflow:hidden;text-align:center;line-height:1.25}
.day-l{display:block;font-size:11.5px;color:var(--text-2);font-weight:500;white-space:nowrap}
.day-col.dc-today .day-l{color:var(--accent);font-weight:700}
.day-d{display:block;font-size:10.5px;color:var(--faint);white-space:nowrap}
.day-col.dc-today .day-d{color:var(--accent);font-weight:700}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.bar-row{display:flex;align-items:center;gap:14px;font-size:12.5px;margin:7px 0}
.bar-row .name{width:120px;flex-shrink:0;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .count{width:36px;text-align:right;font-family:var(--mono);color:var(--ink)}
/* Einheitlicher vertikaler Rhythmus statt gemischter Margins */
#usageWrap{display:flex;flex-direction:column;gap:18px}
.usage-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;align-items:stretch}
@media (max-width:900px){.usage-grid{grid-template-columns:1fr}}
/* Fortschritts-Quote-Kachel (Kern-Workflow / Abdeckung, Zielrichtung 100 %) */
.ktile.quote .qbar{display:block;margin-top:12px;height:6px;background:rgba(15,15,15,0.08);border-radius:999px;overflow:hidden}
.ktile.quote .qfill{display:block;height:6px;background:var(--accent);border-radius:999px}

/* ===== System ===== */
.sys-sum{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.sys-sum .big{font-family:var(--serif);font-size:24px;letter-spacing:-.01em;display:flex;align-items:center;gap:12px}
.sys-sum .sub{font-size:13px;color:var(--muted)}
.sys-toggle{margin-left:auto;font-size:12.5px;color:var(--accent);cursor:pointer;font-weight:600;border:none;background:transparent;font-family:inherit}
.sys-toggle:hover{text-decoration:underline}
.issue{display:flex;gap:14px;align-items:flex-start;padding:18px 0;border-top:1px solid var(--divider);margin-top:14px}
.issue:first-of-type{margin-top:18px}
.issue .it{flex:1;min-width:0}
.issue .iname{font-weight:600;font-size:14.5px}
.issue .itext{color:var(--text-2);font-size:13.5px;margin-top:4px;line-height:1.55;max-width:640px}
.iact{margin-top:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.mini{font-size:12px;font-weight:600;padding:7px 14px;border-radius:999px;border:1.5px solid var(--border-2);background:transparent;cursor:pointer;color:var(--ink);font-family:inherit}
.mini.primary{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.mini.primary:hover{background:#000}
.mini:hover{background:rgba(15,15,15,0.06)}
.mini-hint{font-size:11.5px;color:var(--muted)}
.issue-x{border:none;background:transparent;color:var(--faint);cursor:pointer;font-size:15px;line-height:1;padding:4px 7px;border-radius:8px;align-self:flex-start;flex-shrink:0}
.issue-x:hover{background:rgba(15,15,15,.06);color:var(--ink)}
.hidden-line{font-size:12.5px;color:var(--muted);margin-top:16px;padding-top:14px;border-top:1px solid var(--divider)}
.hidden-line .undo{color:var(--accent);cursor:pointer;font-weight:600}
.hidden-line .undo:hover{text-decoration:underline}
.ib-row.read{opacity:.5}
.ib-row.read .ib-subj{text-decoration:line-through}
.ok-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;padding-top:16px;border-top:1px solid var(--divider)}
.ok-chip{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--text-2);border:1px solid var(--border);border-radius:999px;padding:5px 13px;background:rgba(255,255,255,.4)}
.recs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.rec{padding:22px 24px;display:flex;flex-direction:column;gap:12px;transition:opacity .2s}
.rec.dismissed{opacity:.5}
.rec .obs{font-size:14px;line-height:1.45}
.rec .beleg{font-family:var(--mono);font-size:12px;color:var(--accent);font-weight:600}
.rec .rule{height:1px;background:var(--divider)}
.rec .emp{font-family:var(--serif);font-size:19px;line-height:1.25}
.rec-actions{display:flex;gap:10px;margin-top:2px;flex-wrap:wrap}
.rec-status{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;margin-left:auto;align-self:center}
.rec-status.done{color:var(--ok)} .rec-status.dismissed{color:var(--muted)}

/* ===== Vertrieb / Branding ===== */
.an-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:stretch;margin-top:24px}
.an-card{display:flex;flex-direction:column}
.an-card .top-post-list{flex:1}
@media (max-width:860px){.an-grid{grid-template-columns:1fr}}
.imp-chart{display:flex;gap:16px;align-items:flex-end;justify-content:center;padding-top:6px;flex-wrap:wrap}
.imp-col{flex:0 1 120px;min-width:64px;max-width:140px;display:flex;flex-direction:column}
.imp-plot{position:relative;height:172px;width:100%}
.imp-bar{position:absolute;left:0;right:0;bottom:0;margin:0 auto;width:100%;max-width:56px;border-radius:8px 8px 3px 3px;min-height:4px;transition:height .2s}
.imp-bar-cur{box-shadow:0 4px 14px rgba(255,69,0,0.18)}
.imp-n{position:absolute;left:0;right:0;text-align:center;font-size:11.5px;color:var(--text-2);font-weight:600;font-variant-numeric:tabular-nums}
.imp-foot{margin-top:9px;text-align:center;line-height:1.25}
.imp-l{display:block;font-size:11.5px;color:var(--text-2);font-weight:500}
.imp-d{display:block;font-size:10.5px;color:var(--faint)}
.src-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:0}
@media (max-width:920px){.src-grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.src-grid{grid-template-columns:1fr}}
.src-card{display:flex;flex-direction:column;gap:10px;padding:18px 18px}
.src-card.off{border-style:dashed;opacity:.66}
.src-head{display:flex;align-items:center;gap:10px}
.src-logo{width:24px;height:24px;flex-shrink:0;color:var(--ink);display:inline-flex}
.src-logo svg{width:100%;height:100%}
.src-card.off .src-logo{color:var(--muted)}
.src-nm{font-weight:600;font-size:14.5px}
.src-status{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-2)}
.src-stats{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink-2)}
.score-legend{font-size:11.5px;color:var(--muted);margin-top:14px;padding-top:12px;border-top:1px solid var(--divider)}
.rev-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.rev-year-switch{display:flex;align-items:center;gap:8px}
.rev-year-btn{padding:3px 10px;font-size:13px;line-height:1}
.rev-year-label{font-size:13px;font-weight:600;min-width:34px;text-align:center}
.rev-plot{display:flex;align-items:flex-end;gap:4px;height:160px;padding-top:20px;border-bottom:1px solid var(--divider)}
.rev-col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.rev-val{font-size:10px;color:var(--muted);margin-bottom:2px;white-space:nowrap}

.rev-seg-won{background:var(--ok);border-radius:3px 3px 0 0}

.rev-labels{display:flex;gap:4px;margin-top:6px}
.rev-m-label{flex:1;text-align:center;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.rev-m-label.cur{color:var(--accent);font-weight:700}
.rev-legend{display:flex;gap:16px;margin-top:12px;font-size:11.5px;color:var(--muted)}
.rev-legend-item{display:flex;align-items:center;gap:6px}
.rev-legend-box{width:11px;height:11px;border-radius:2px;display:inline-block}
.rev-legend-box.won{background:var(--ok)}
.rev-legend-box.forecast{background:color-mix(in srgb, var(--accent) 18%, transparent);border:1.5px dashed var(--accent);box-sizing:border-box}
.pe-list{display:flex;flex-direction:column}
.pe-row{display:grid;grid-template-columns:1.4fr .9fr .9fr 1.2fr;gap:10px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--divider);font-size:13px}
.pe-row:last-child{border-bottom:none}
.pe-row.pe-past{opacity:.5}
.pe-name{font-weight:600}
.pe-date{color:var(--muted);font-size:12px}
.pe-booked{color:var(--text-2);font-size:12.5px}
.pe-plan{text-align:right;font-size:12.5px}
.pipe-board{display:flex;gap:18px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
.pipe-col{flex:0 0 250px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 14px 16px;display:flex;flex-direction:column;gap:12px;min-height:90px;transition:border-color .15s,background .15s}
.pipe-col-body{display:flex;flex-direction:column;gap:12px;flex:1;min-height:70px}
.pipe-col-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-bottom:8px;border-bottom:1px solid var(--divider)}
.pipe-col-head .lbl{font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px}
.pipe-col-head .cnt{font-family:var(--mono);font-size:12px;color:var(--muted);background:rgba(15,15,15,0.06);border-radius:999px;padding:2px 9px}
.pipe-col-empty{font-size:12.5px;color:var(--faint);font-style:italic;padding:6px 0}
.deal-card{background:var(--card-solid);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;font-size:13px;transition:transform .15s,box-shadow .15s,border-color .15s;position:relative}
.deal-card:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(15,15,15,0.08);border-color:var(--border-2)}
.deal-card .nm{font-weight:600;font-size:13.5px}
.deal-card .co{color:var(--muted);font-size:12px;margin-top:2px}
.deal-card .val{font-family:var(--mono);font-size:13px;color:var(--ink-2);margin-top:8px}

.deal-card .foot.overdue{color:var(--fail);font-weight:600}

.cp-board{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.cp-col{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:10px}
.cp-col-head{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700;padding-bottom:6px;border-bottom:1px solid var(--divider)}
.cp-card{background:var(--card-solid);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;font-size:13px;transition:transform .15s,box-shadow .15s,border-color .15s}
.cp-card:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(15,15,15,0.08);border-color:var(--border-2)}
.cp-card .t{font-weight:600;font-size:13.5px}
.cp-card .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.cal-cell{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px;min-height:92px;display:flex;flex-direction:column;gap:4px}
.cal-cell.other-month{opacity:.4}
.cal-cell .dnum{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.cal-chip{font-size:10.5px;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:2px 6px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.plat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 20px}
.plat-card .ph{display:flex;align-items:center;gap:10px}
.plat-card .ph .nm{font-weight:600;font-size:14.5px}
.plat-card .pbody{font-size:13px;color:var(--text-2);margin-top:8px;line-height:1.5}
.plat-stats{margin-top:8px;font-size:13px;color:var(--ink-2)}
.plat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}

/* Abgleich mit den von den Modulen emittierten Klassennamen */
.pipe-col-head .pipe-col-label{font-size:13px;font-weight:600}
.pipe-col-head .pipe-col-count{font-family:var(--mono);font-size:12px;color:var(--muted);background:rgba(15,15,15,0.06);border-radius:999px;padding:2px 9px}
.pipe-col-head .pipe-col-sum{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.deal-card .deal-name{font-weight:600;font-size:13.5px}
.deal-card .deal-company{color:var(--muted);font-size:12px;margin-top:2px}
.deal-card .deal-value{font-family:var(--mono);font-size:13px;color:var(--ink-2);margin-top:8px}
.deal-card .deal-next{font-size:12px;color:var(--text-2);margin-top:6px;line-height:1.4}
.deal-card .deal-due{margin-top:8px;padding-top:8px;border-top:1px solid var(--divider);font-size:11.5px;color:var(--muted)}
.deal-card .deal-due.overdue,.due-deal-row.overdue .due{color:var(--fail);font-weight:600}
.stage-bar{display:flex;height:18px;border-radius:999px;overflow:hidden;background:rgba(15,15,15,0.06);margin-top:12px}
.stage-seg{height:100%;border-right:2px solid var(--bg);position:relative}
.stage-seg-num{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:var(--mono);font-size:11px;font-weight:600;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35);pointer-events:none}
.stage-leg-item.zero{opacity:.35}
.stage-seg:last-child{border-right:none}
.stage-seg-1,.dot-sq.stage-seg-1{background:#f29c72}
.stage-seg-2,.dot-sq.stage-seg-2{background:#e86f38}
.stage-seg-3,.dot-sq.stage-seg-3{background:#c14f1a}
.stage-seg-4,.dot-sq.stage-seg-4{background:#8f3a10}
.stage-seg-won,.dot-sq.stage-seg-won{background:var(--ok)}
.stage-seg-lost,.dot-sq.stage-seg-lost{background:#b3aea3}
.stage-seg-paused,.dot-sq.stage-seg-paused{background:#c9c4b9}
.stage-legend{display:flex;flex-wrap:wrap;gap:10px 16px;margin-top:12px}
.stage-leg-item{font-size:12px;color:var(--text-2);display:inline-flex;align-items:center;gap:6px}
.dot-sq{width:10px;height:10px;border-radius:3px;display:inline-block}
.due-deal-list{display:flex;flex-direction:column}
.due-deal-row{display:grid;grid-template-columns:1.2fr 1fr 1.4fr auto auto;gap:10px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--divider);font-size:13px}
.due-deal-actions{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.due-deal-hint{font-size:10.5px;color:var(--muted);white-space:nowrap}
.due-deal-copy{white-space:nowrap}
.due-deal-row:last-child{border-bottom:none}
.due-deal-row .name{font-weight:600}
.due-deal-row .company{color:var(--muted);font-size:12px}
.due-deal-row .next{color:var(--text-2);font-size:12.5px}
.due-deal-row .due{font-size:12px;color:var(--muted);white-space:nowrap}
.leads-list{display:flex;flex-direction:column}
.lead-row{padding:10px 2px;border-bottom:1px solid var(--divider)}
.lead-row:last-child{border-bottom:none}
.lead-card{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--divider)}
.lead-card:last-child{border-bottom:none}
.lead-avatar{width:34px;height:34px;border-radius:50%;background:rgba(15,15,15,.07);color:var(--ink-2);display:inline-flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;flex-shrink:0}
.lead-main{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;flex:1;min-width:0}
.lead-body{flex:1;min-width:0}
.lead-top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.lead-top .lead-date{margin-left:auto}
.tp-body{display:flex;flex-direction:column;gap:3px;min-width:0}
.lead-name{font-weight:600;font-size:13.5px}
.lead-company{color:var(--muted);font-size:12.5px}
.lead-date{margin-left:auto;font-size:11.5px;color:var(--muted)}
.lead-extra{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.lead-chip{font-size:11px;background:rgba(15,15,15,0.05);border:1px solid var(--border);border-radius:999px;padding:2px 9px;color:var(--text-2)}
.cp-view{margin-top:14px}
.cp-card .cp-title{font-weight:600;font-size:13.5px}
.cp-card .cp-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.cp-format{font-size:11px;color:var(--muted)}
.cp-pub{font-size:11.5px;color:var(--muted);margin-top:6px}
.cp-viral{font-size:11px;color:var(--muted)}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.cal-month{font-weight:600;font-size:14px}
.cal-wd{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:center;padding:4px 0}
.cal-daynum{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.cal-cell.outside{opacity:.4}
.cal-chip-draft{background:var(--warn-bg);color:var(--warn)}

/* Content-Filter, Speichern-Leiste, Pending-Overlay, Top-Post-Liste, Pillar-Chips (Kontrakt Iteration 2) */
.filter-select{font-family:inherit;font-size:13px;color:var(--text);background:var(--card-solid);border:1px solid var(--border-2);border-radius:var(--radius-sm);padding:8px 12px;cursor:pointer}
.filter-select:hover{border-color:var(--ink)}
.top-post-row{display:flex;align-items:center;gap:16px;padding:12px 0;border-bottom:1px solid var(--divider)}
.top-post-row:last-child{border-bottom:none}
.tp-rank{font-family:var(--serif);font-size:26px;font-style:italic;color:var(--faint);line-height:1;width:30px;text-align:center;flex-shrink:0}
.pillar-chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;border-radius:999px;padding:3px 11px}
.pillar-dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:currentColor;flex:0 0 auto}

@media (max-width:900px){
  .cp-board{grid-template-columns:1fr}
  .pipe-col{flex:0 0 210px}
  .plat-grid{grid-template-columns:1fr}
}
@media (max-width:640px){
  .cal-grid{grid-template-columns:repeat(7,minmax(34px,1fr));font-size:11px}
  .cal-cell{min-height:58px;padding:5px}
}

/* menus / action panel / misc */
.menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--card-solid);border:1px solid var(--border-2);border-radius:14px;box-shadow:0 12px 34px rgba(0,0,0,.14);min-width:236px;z-index:160;display:none;padding:7px}
.menu.open{display:block}
.menu-label{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:6px 10px 4px}
.menu-item{display:block;width:100%;text-align:left;background:transparent;border:none;padding:9px 11px;font-size:13px;border-radius:9px;cursor:pointer;color:var(--text);font-family:inherit}
.menu-item:hover{background:rgba(15,15,15,0.06)}
.menu-item:disabled{opacity:.4;cursor:not-allowed}
.menu-item .h{display:block;font-size:10.5px;color:var(--muted);margin-top:2px}
.menu-item .h.claude{color:var(--accent)}
.action-overlay{position:fixed;inset:0;z-index:200;background:rgba(15,15,15,.32);backdrop-filter:blur(2px);display:none;align-items:center;justify-content:center;padding:24px}
.action-modal{background:var(--card-solid);border:1px solid var(--border-2);border-radius:var(--radius);width:100%;max-width:640px;max-height:82vh;overflow-y:auto;padding:22px 26px;box-shadow:0 24px 70px rgba(0,0,0,.28);animation:rise .2s ease}
.ap-head{display:flex;justify-content:space-between;align-items:center;gap:14px}
.ap-title{font-weight:600;font-size:15px;display:flex;align-items:center;gap:10px}
.ap-close{border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:4px 6px;border-radius:8px}
.ap-close:hover{background:rgba(15,15,15,.07);color:var(--ink)}
.ap-status{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:8px;margin-top:10px}
.spinner{width:13px;height:13px;border:2px solid var(--border-2);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ap-hint{font-size:12px;color:var(--accent);font-weight:600;margin-top:6px}
.ap-out{margin-top:14px;background:rgba(255,255,255,0.5);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px 18px;font-family:var(--mono);font-size:12px;line-height:1.6;white-space:pre-wrap;max-height:360px;overflow-y:auto;color:var(--ink-2);display:none}
.run-indicator{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--border-2);background:rgba(255,255,255,0.35);color:var(--ink-2);cursor:pointer;height:34px;padding:0 13px;border-radius:999px;font-size:12px;font-weight:600;flex-shrink:0}
.run-indicator:hover{background:rgba(15,15,15,0.06)}
.detail-modal{max-width:720px}
.dp-body{margin-top:12px}
.dp-pre{white-space:pre-wrap;font-family:var(--mono);font-size:12.5px;line-height:1.5}
.dp-quote{border-left:3px solid var(--border-2);padding-left:14px;margin:10px 0;font-style:italic;color:var(--muted)}
.imp-loading{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;padding:20px 4px}
.state-note{font-size:13px;color:var(--muted);font-style:italic;padding:14px 2px;display:flex;gap:10px;align-items:flex-start}
.state-note.stale{color:var(--warn);font-style:normal}
.state-note.missing{color:var(--fail);font-style:normal}
.state-note .fixhint{display:block;color:var(--text-2);font-style:normal;margin-top:4px;font-size:12px}
.demo-flag{font-size:11px;color:var(--muted);border:1px dashed var(--border-2);border-radius:999px;padding:3px 12px}
.toasts{position:fixed;bottom:24px;right:24px;display:flex;flex-direction:column;gap:10px;z-index:999}
.toast{background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:13px;max-width:360px;box-shadow:0 8px 28px rgba(0,0,0,.24);animation:rise .25s ease}
.toast.err{background:var(--fail);color:#fff}
.data-error-banner{position:fixed;top:0;left:0;right:0;z-index:1000;background:var(--fail);color:#fff;font-size:13px;text-align:center;padding:10px 16px}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (max-width:1060px){.brain-wrap{grid-template-columns:1fr}.kpi-rail{flex-direction:row;flex-wrap:wrap;gap:12px}.kpi-rail .rail-title{flex-basis:100%}.kpi{flex:1 1 150px;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:8px;border-top:none;border-left:1px solid var(--divider);padding:6px 0 6px 16px}.kpi .meta{text-align:left}.today{grid-template-columns:1fr}.two-col{grid-template-columns:1fr}}
@media (max-width:1160px){header.head{flex-direction:column}.head-right{align-items:flex-start;text-align:left}}
@media (max-width:820px){
  .content{padding:24px 18px 90px}
  body.sb-open .content{margin-left:var(--sbw)}
  body.sb-open #sb{box-shadow:12px 0 34px rgba(15,15,15,0.16)}
  h1.title{font-size:34px}
  .hero{height:380px}
  .hero-total .n{font-size:50px}
}
@media (prefers-reduced-motion:reduce){.spinner{animation:none}}
</style>
</head>
<body>
<div class="ornament"></div>

<aside id="sb">
  <div class="sb-top">
    <button id="sbToggle" title="Navigation ein-/ausklappen" aria-label="Navigation">
      <svg viewBox="0 0 20 20" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="3" y1="5.5" x2="17" y2="5.5"></line><line x1="3" y1="10" x2="17" y2="10"></line><line x1="3" y1="14.5" x2="17" y2="14.5"></line></svg>
    </button>
    <span class="sb-brand">AI<em>OS</em></span>
  </div>
  <nav class="sb-nav">
    <div class="sb-group">
      <div class="sb-group-label">Arbeit</div>
      <button class="sb-item" data-page="dashboard" title="Dashboard"><span class="sb-ico"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="6" height="6" rx="1.5"></rect><rect x="11" y="3" width="6" height="6" rx="1.5"></rect><rect x="3" y="11" width="6" height="6" rx="1.5"></rect><rect x="11" y="11" width="6" height="6" rx="1.5"></rect></svg></span><span class="sb-label">Dashboard</span></button>
      <button class="sb-item" data-page="projekte" title="Projekte"><span class="sb-ico"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H8l1.5 2h6A1.5 1.5 0 0 1 17 8.5V14a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 3 14V6.5z"></path></svg></span><span class="sb-label">Projekte</span></button>
      <button class="sb-item" data-page="aufgaben" title="Aufgaben"><span class="sb-ico"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="3" y="3" width="14" height="14" rx="3"></rect><path d="M7 10.2l2.2 2.2L13.4 8"></path></svg></span><span class="sb-label">Aufgaben</span></button>
      <button class="sb-item" data-page="inbox" title="Inbox"><span class="sb-ico"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11h4l1.5 2h3L13 11h4"></path><path d="M4.5 4h11L17 11v4a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 3 15v-4l1.5-7z"></path></svg></span><span class="sb-label">Inbox</span><span class="nav-badge" id="navBadgeInbox"></span></button>
    </div>
    <div class="sb-group">
      <div class="sb-group-label">System</div>
      <button class="sb-item" data-page="skills" title="Skills &amp; Commands"><span class="sb-ico"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M11 2.5L4.5 11H10l-1 6.5L15.5 9H10l1-6.5z"></path></svg></span><span class="sb-label">Skills &amp; Commands</span></button>
      <button class="sb-item" data-page="automationen" title="Automationen"><span class="sb-ico"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="10" cy="10" r="7"></circle><path d="M10 6v4l2.8 2"></path></svg></span><span class="sb-label">Automationen</span></button>
      <button class="sb-item" data-page="system" title="Zustand"><span class="sb-ico"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 10h3l2-4.5 3 9 2-4.5h5"></path></svg></span><span class="sb-label">Zustand</span><span class="nav-badge" id="navBadgeSystem"></span></button>
      <button class="sb-item" data-page="nutzung" title="Nutzung"><span class="sb-ico"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="4.5" y1="16" x2="4.5" y2="10"></line><line x1="10" y1="16" x2="10" y2="4"></line><line x1="15.5" y1="16" x2="15.5" y2="7"></line></svg></span><span class="sb-label">Nutzung</span></button>
    </div>
  </nav>
  <div class="sb-foot">
    <button id="profileBtn"><span class="avatar">DU</span><span class="pf-meta"><span class="pf-name">Dein AIOS</span><span class="pf-sub">lokal · nur auf deinem Rechner</span></span></button>
    <div class="menu" id="profileMenu"></div>
  </div>
</aside>

<div class="content">
  <header class="head">
    <div>
      <p class="eyebrow">AI Operating System</p>
      <h1 class="title" id="pageTitle">Dashboard</h1>
      <p class="page-sub"><span id="pageSub"></span><span class="stand" id="dataStand"></span></p>
    </div>
    <div class="head-right">
      <div class="head-clock-row">
        <button class="run-indicator" id="runIndicator" style="display:none" title="Laufender Claude-Lauf — klicken für Details">
          <span class="spinner"></span><span id="runIndicatorLabel"></span>
        </button>
        <button class="icon-btn" id="refreshBtn" title="Daten neu einsammeln" aria-label="Aktualisieren">
          <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 10a6.5 6.5 0 1 1-1.9-4.6"></path><path d="M16.6 3.2v3.4h-3.4"></path></svg>
        </button>
        <div class="head-clock mono" id="clock">--:--</div>
      </div>
      <div class="head-date" id="headDate">—</div>
    </div>
  </header>

  <section class="page" data-page="dashboard">
    <div class="kpi-strip" id="kpiStrip"></div>
    <section class="blk" style="margin-top:32px">
      <div class="sec-head"><span class="kick">Second Brain</span><h2>Dein Wissen, <em>auf einen Blick</em></h2><span class="rule"></span></div>
      <div class="brain-wrap">
        <div class="hero" id="hero">
          <canvas id="brainCanvas"></canvas>
          <div class="hero-overlay">
            <div class="hero-top">
              <div class="hero-eye"><span id="brainClusters">—</span> Themen-Cluster</div>
              <div class="hero-chip" id="brainChip"><span class="cdot"></span><span id="brainChipTxt"></span></div>
            </div>
            <div class="hero-bottom">
              <div class="hero-total">
                <div class="n"><span id="brainTotal">—</span><small id="brainNew"></small></div>
                <div class="l">Notizen im Second Brain</div>
              </div>
            </div>
          </div>
          <div class="hero-state" id="brainState" style="display:none"></div>
        </div>
        <aside class="kpi-rail" id="kpiRail"></aside>
      </div>
      <div class="sysline" id="sysLine"></div>
    </section>
    <section class="blk">
      <div class="sec-head"><span class="kick">Heute</span><h2>Das Wichtigste <em>für heute</em></h2><span class="rule"></span></div>
      <div class="today">
        <div class="card focus" id="focusList"></div>
        <div class="side-stack" id="sideStack"></div>
      </div>
    </section>
    <div id="onboardingHint"></div>
  </section>

  <section class="page" data-page="projekte">
    <div id="projList">
      <div class="kpi-strip" id="projStrip"></div>
      <section class="blk" style="margin-top:32px">
        <div class="sec-head"><span class="kick">Aktiv</span><h2>In Arbeit</h2><span class="rule"></span><span class="aside" id="projCount"></span></div>
        <div class="proj-grid" id="projGrid"></div>
        <div class="rest-list" id="restList" style="display:none">
          <p class="rest-title">Ruhende Projekte</p>
          <div id="restRows"></div>
        </div>
      </section>
    </div>
    <div id="projDetail" style="display:none;margin-top:24px"></div>
  </section>

  <section class="page" data-page="aufgaben">
    <section class="blk" style="margin-top:24px"><div id="tasksWrap"></div></section>
  </section>

  <section class="page" data-page="inbox">
    <section class="blk" style="margin-top:24px"><div id="inboxWrap"></div></section>
  </section>

  <section class="page" data-page="skills">
    <section class="blk" style="margin-top:24px"><div id="skillsWrap"></div></section>
